<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Manicure</title>
<meta name="theme-color" content="#a3294f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: barra superior + abas; agenda em grade de 30 min; modais sobrepostos */
:root{--bg:#faf6f6;--card:#fff;--fg:#2a2326;--mu:#7d6f75;--bd:#eadfe2;--ac:#a3294f;--ac2:#f6e3ea;--ok:#2f7d4f;--wa:#b7791f;--er:#b3261e;
--s-conf:#3b6fb6;--s-sal:#8a5cc2;--s-and:#c27a1a;--s-fin:#2f7d4f;--s-fat:#1f5f3a;--s-pen:#b3261e;--s-can:#8b8085;--s-blk:#5b5559;
--fd:"Fraunces",Georgia,serif;--fb:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1518;--card:#262024;--fg:#f3e9ec;--mu:#b7a5ac;--bd:#3a3036;--ac:#ef7fa2;--ac2:#3b2630;--ok:#6fcf97;--wa:#e6b35a;--er:#ff8a80;--s-conf:#7aa7e6;--s-sal:#b999e6;--s-and:#e6a84f;--s-fin:#6fcf97;--s-fat:#4fb57b;--s-pen:#ff8a80;--s-can:#a89ca1;--s-blk:#a89ca1;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1518;--card:#262024;--fg:#f3e9ec;--mu:#b7a5ac;--bd:#3a3036;--ac:#ef7fa2;--ac2:#3b2630;--ok:#6fcf97;--wa:#e6b35a;--er:#ff8a80;--s-conf:#7aa7e6;--s-sal:#b999e6;--s-and:#e6a84f;--s-fin:#6fcf97;--s-fat:#4fb57b;--s-pen:#ff8a80;--s-can:#a89ca1;--s-blk:#a89ca1;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--fb);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;min-width:0}
h1{font:600 22px var(--fd);margin:0}h2{font:600 17px var(--fd);margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sync{font-size:12px;color:var(--mu)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;color:var(--mu);font:500 14px var(--fb);padding:9px 4px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff}
button,input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btn{border:1px solid var(--bd);background:var(--card);padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.d{color:var(--er)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar .grow{flex:1;min-width:140px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 11px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--ac2);color:var(--ac);font-weight:700}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);margin:3px 0 10px}
label{font-size:12px;color:var(--mu);font-weight:500}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;min-width:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:9px 12px}
.kpi b{display:block;font:600 20px var(--fd);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}.neg{color:var(--er)}.pos{color:var(--ok)}
.slot{display:grid;grid-template-columns:48px 1fr;gap:8px;border-top:1px solid var(--bd);min-height:34px;padding:3px 0}
.slot.now{border-top:2px solid var(--ac)}
.slot .hh{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums;padding-top:4px}
.ev{border-left:4px solid var(--c,var(--s-conf));background:var(--card);border-radius:8px;padding:6px 9px;margin-bottom:4px;cursor:pointer;min-width:0;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ev b{font-weight:700}.ev.cancelled{opacity:.55;text-decoration:line-through}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;color:var(--c);border:1px solid var(--c);white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:6px;overflow-x:auto;padding-bottom:6px}
.wd{min-width:0}.wd h3{font-size:12px;margin:0 0 4px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.wd.today h3{color:var(--ac)}
.wd .ev{font-size:12px;padding:4px 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:11px;color:var(--mu);text-align:center;text-transform:uppercase}
.cal button{aspect-ratio:1/1;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0;font-variant-numeric:tabular-nums}
.cal button small{font-size:10px;color:var(--ac);font-weight:700}
.cal button.sel{background:var(--ac);color:#fff;border-color:var(--ac)}.cal button.sel small{color:#fff}
.cal button.out{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(20,10,14,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding-top:env(safe-area-inset-top,0px)}
.modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.empty{text-align:center;color:var(--mu);padding:26px 10px;border:1px dashed var(--bd);border-radius:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mu)}
.bars i{display:block;width:42%;min-height:2px;border-radius:3px 3px 0 0}.bars .pair{display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;z-index:90}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.6}}}
.banner{border-color:var(--wa)}.banner[hidden]{display:none}</style>

</head>
<body>
<div class="wrap">
 <div class="top"><h1>Agenda Manicure</h1><div class="row"><span class="sync" id="sync"></span><button class="btn sm" id="bk" type="button">Planilha</button></div></div>
 <div class="card banner" id="cf" hidden><b>A planilha tem uma versão diferente da deste aparelho.</b><div class="mu">Escolha qual manter. A outra fica guardada no Historico da planilha.</div><div class="bar" style="margin:8px 0 0"><button class="btn p" id="cf1" type="button">Usar a da planilha</button><button class="btn" id="cf2" type="button">Manter a deste aparelho</button></div></div>
 <div class="tabs" id="tabs"></div>
 <div id="v"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
var ST=["Confirmado","No Salão","Em Andamento","Finalizado","Faturado","Pgto. Pendente","Cancelado"];
var SC=["conf","sal","and","fin","fat","pen","can"];
var FP=["PIX","Dinheiro","Cartão de Débito","Cartão de Crédito","Transferência","Outro"];
var DOW=["dom","seg","ter","qua","qui","sex","sáb"];
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function defS(){return{c:[],s:[
{id:"s1",n:"Esmaltação simples (mão)",e:"Mãos",d:60,p:35,pm:0,ds:""},
{id:"s2",n:"Esmaltação simples (pé)",e:"Pés",d:60,p:40,pm:0,ds:""},
{id:"s3",n:"Mão + Pé",e:"Combos",d:120,p:70,pm:0,ds:""},
{id:"s4",n:"Esmaltação em gel",e:"Mãos",d:90,p:90,pm:0,ds:""},
{id:"s5",n:"Alongamento em gel",e:"Mãos",d:150,p:160,pm:0,ds:""},
{id:"s6",n:"Manutenção de alongamento",e:"Mãos",d:120,p:110,pm:0,ds:""}],a:[],f:[],cfg:{lem:24}}}
var S=defS(),tab="agenda",view="1d",day=iso(new Date()),cmonth=day.slice(0,7),sf=[],q="",per="mes",ft="all",toastT;
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function br(s){return s?s.split("-").reverse().join("/"):""}
function brl(n){return "R$ "+Number(n||0).toFixed(2).replace(".",",")}
function hm(m){var h=Math.floor(m/60),x=m%60;return (h<10?"0":"")+h+":"+(x<10?"0":"")+x}
function tm(h){var p=h.split(":");return +p[0]*60+ +p[1]}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(i){return document.getElementById(i)}
function cl(id){return S.c.find(function(x){return x.id==id})}
function sv(id){return S.s.find(function(x){return x.id==id})}
function ap(id){return S.a.find(function(x){return x.id==id})}
function toast(t){var e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},2600)}
function openM(h){$("sheet").innerHTML=h;$("modal").hidden=false}
function closeM(){$("modal").hidden=true;$("sheet").innerHTML=""}
$("modal").addEventListener("mousedown",function(e){if(e.target===this)closeM()});
/* ---- salvar: navegador + planilha do Google ---- */
var CFG={url:"",tok:""},rv=0,dirty=false,saveT=null,busy=false,again=false,lastJson="",CONF=null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(){var r=lsGet("agm2");if(r){try{var o=JSON.parse(r);if(o&&o.a)S=o}catch(e){}}
 try{var c=JSON.parse(lsGet("agm_cfg")||"{}");CFG.url=c.url||"";CFG.tok=c.tok||""}catch(e){}
 try{var m=JSON.parse(lsGet("agm_meta")||"{}");rv=m.rv||0;dirty=!!m.dirty}catch(e){}
 lastJson=JSON.stringify(S)}
function meta(){lsSet("agm_meta",JSON.stringify({rv:rv,dirty:dirty}))}
function setSync(t){$("sync").textContent=t}
function stamp(){return new Date().toTimeString().slice(0,5)}
function save(){lastJson=JSON.stringify(S);lsSet("agm2",lastJson);dirty=true;meta();
 if(CFG.url){setSync("salvando…");clearTimeout(saveT);saveT=setTimeout(function(){push()},800)}else setSync("só neste aparelho")}
function api(b){return fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({tok:CFG.tok},b))}).then(function(r){return r.json()})}
function push(force){if(!CFG.url||CONF)return;if(busy){again=true;return}busy=true;
 api({op:"save",baseV:rv,json:lastJson,force:force===true}).then(function(r){
  if(r.ok){rv=r.v;dirty=false;meta();setSync("salvo na planilha às "+stamp())}
  else if(r.conflict){CONF=r;$("cf").hidden=false;window.scrollTo(0,0);setSync("aguardando sua escolha")}
  else setSync("erro: "+(r.error||"sem resposta"))
 }).catch(function(){setSync("sem conexão (será reenviado)")}).then(function(){busy=false;if(again){again=false;push()}})}
function pull(){if(!CFG.url||dirty||busy||CONF)return;busy=true;
 api({op:"load"}).then(function(r){
  if(!r.ok){setSync("erro: "+(r.error||""));return}
  if(r.v==0){dirty=true;meta();busy=false;push();return}
  if(r.v>rv&&r.json){try{var o=JSON.parse(r.json);if(o&&o.a){S=o;rv=r.v;lastJson=r.json;dirty=false;meta();lsSet("agm2",r.json);render()}}catch(e){}}
  setSync("sincronizado às "+stamp())
 }).catch(function(){setSync("sem conexão")}).then(function(){busy=false})}
function useRemote(){try{S=JSON.parse(CONF.json);rv=CONF.v;lastJson=CONF.json;lsSet("agm2",lastJson);dirty=false;meta()}catch(e){}CONF=null;$("cf").hidden=true;setSync("sincronizado às "+stamp());render()}
function keepLocal(){rv=CONF.v;CONF=null;$("cf").hidden=true;meta();push(true)}
$("cf1").onclick=useRemote;$("cf2").onclick=keepLocal;
document.addEventListener("visibilitychange",function(){if(!document.hidden&&CFG.url){if(dirty)push();else pull()}});
window.addEventListener("online",function(){if(CFG.url){if(dirty)push();else pull()}});
/* ---- planilha e backup ---- */
$("bk").onclick=function(){openM('<h2>Planilha e backup</h2><p class="mu">Os dados ficam neste aparelho e, com a planilha conectada, também no Google Sheets.</p><label for="su">Endereço do Apps Script (termina em /exec)</label><input id="su" value="'+esc(CFG.url)+'" placeholder="https://script.google.com/macros/s/…/exec"><label for="st">Senha</label><input id="st" type="password" value="'+esc(CFG.tok)+'"><div class="bar"><button class="btn p" id="sc" type="button">Salvar e conectar</button><button class="btn" id="sy" type="button">Sincronizar agora</button></div><h2 style="margin-top:14px">Backup em arquivo</h2><div class="bar"><button class="btn p" id="bd" type="button">Baixar backup</button><button class="btn" id="bc" type="button">Baixar clientes (CSV)</button></div><label for="bf">Restaurar de arquivo .json</label><input type="file" id="bf" accept=".json,application/json"><div class="bar"><button class="btn" type="button" onclick="closeM()">Fechar</button></div>');
 $("sc").onclick=function(){var u=$("su").value.trim();if(u.indexOf("https://script.google.com/")!=0){toast("O endereço deve começar com https://script.google.com/");return}
  CFG.url=u;CFG.tok=$("st").value;lsSet("agm_cfg",JSON.stringify(CFG));dirty=true;meta();CONF=null;$("cf").hidden=true;setSync("conectando…");closeM();push();toast("Conectando à planilha…")};
 $("sy").onclick=function(){if(!CFG.url){toast("Conecte a planilha primeiro");return}if(dirty)push();else pull();toast("Sincronizando…")};
 $("bd").onclick=function(){dl("agenda-manicure-"+iso(new Date())+".json",JSON.stringify(S))};
 $("bc").onclick=function(){var r=["Nome;Apelido;Telefone;Nascimento;Observações"].concat(S.c.map(function(c){return [c.n,c.ap,c.w,c.nasc,c.ob].map(function(x){return '"'+String(x||"").replace(/"/g,'""')+'"'}).join(";")}));dl("clientes.csv","﻿"+r.join("\n"))};
 $("bf").onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.a||!o.c||!o.s)throw 1;S=o;save();closeM();render();toast("Backup restaurado")}catch(e){toast("Arquivo inválido")}};rd.readAsText(f)}};
function dl(name,data){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500)}
/* ---- agenda ---- */
function dayEvs(dt){return S.a.filter(function(a){if(a.dt!=dt)return false;
 if(a.blk)return !sf.length&&!q;
 if(sf.length&&sf.indexOf(a.st)<0)return false;
 if(q){var c=cl(a.c),t=((c?c.n+" "+(c.ap||""):"")+" "+a.sv.map(function(i){var s=sv(i);return s?s.n:""}).join(" ")).toLowerCase();if(t.indexOf(q.toLowerCase())<0)return false}
 return true}).sort(function(x,y){return x.h<y.h?-1:x.h>y.h?1:0})}
function evH(a){
 if(a.blk)return '<div class="ev" style="--c:var(--s-blk)" onclick="openBlk(\''+a.id+'\')"><b>'+a.h+' · Bloqueado</b> <span class="mu">'+esc(a.nt||"")+' · '+a.dur+' min</span></div>';
 var c=cl(a.c),i=ST.indexOf(a.st),n=a.sv.map(function(x){var s=sv(x);return s?s.n:"?"}).join(" + ");
 return '<div class="ev'+(a.st=="Cancelado"?" cancelled":"")+'" style="--c:var(--s-'+SC[i]+')" onclick="openAp(\''+a.id+'\')"><div class="row"><b>'+a.h+' · '+esc(c?c.n:"Cliente removida")+'</b><span class="pill" style="--c:var(--s-'+SC[i]+')">'+a.st+'</span></div><div class="mu">'+esc(n)+' · '+a.dur+' min · '+brl(a.p)+'</div></div>'}
function nav(n){if(view=="1d")day=addD(day,n);else if(view=="7d")day=addD(day,7*n);else{var d=pd(day);d.setMonth(d.getMonth()+n,1);day=iso(d)}render()}
function agendaV(){
 var d=pd(day),lab=view=="mes"?MES[d.getMonth()]+" "+d.getFullYear():DOW[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()]+" "+d.getFullYear();
 var h='<div class="bar"><button class="btn p" type="button" onclick="newAp()">Novo agendamento</button><button class="btn" type="button" onclick="openBlk()">Bloquear</button><span class="seg">'+["1d","7d","mes"].map(function(v){return '<button type="button" class="'+(view==v?"on":"")+'" onclick="view=\''+v+'\';render()">'+(v=="mes"?"Mês":v.toUpperCase())+'</button>'}).join("")+'</span></div>';
 h+='<div class="bar"><button class="btn sm" type="button" aria-label="Anterior" onclick="nav(-1)">‹</button><button class="btn sm" type="button" onclick="day=iso(new Date());render()">Hoje</button><button class="btn sm" type="button" aria-label="Próximo" onclick="nav(1)">›</button><b style="margin-left:4px">'+esc(lab)+'</b><input type="date" id="jd" aria-label="Ir para a data" value="'+day+'" onchange="day=this.value||day;render()" style="width:auto;margin:0 0 0 auto"></div>';
 h+='<div class="bar"><input id="qs" class="grow" style="margin:0" placeholder="Buscar cliente ou serviço" value="'+esc(q)+'" oninput="q=this.value;var p=this.selectionStart;render();var e=$(\'qs\');e.focus();e.setSelectionRange(p,p)"></div>';
 h+='<div class="chips">'+ST.map(function(s,i){return '<button type="button" class="chip'+(sf.indexOf(s)>=0?" on":"")+'" onclick="togSf(\''+s+'\')"><span style="color:var(--s-'+SC[i]+')">●</span> '+s+'</button>'}).join("")+(sf.length||q?'<button type="button" class="chip" onclick="sf=[];q=\'\';render()">Limpar</button>':"")+'</div>';
 h+=view=="1d"?dayH():view=="7d"?weekH():monthH();return h}
function togSf(s){var i=sf.indexOf(s);if(i>=0)sf.splice(i,1);else sf.push(s);render()}
function dayH(){var es=dayEvs(day),now=new Date(),nm=now.getHours()*60+now.getMinutes(),isT=day==iso(now),h="";
 if(!es.length)h+='<div class="empty">Nenhum horário neste dia.<br><button class="btn p" style="margin-top:8px" type="button" onclick="newAp()">Agendar agora</button></div>';
 var by={};es.forEach(function(a){var k=Math.min(27,Math.max(0,Math.floor((tm(a.h)-420)/30)));(by[k]=by[k]||[]).push(a)});
 var tot=es.filter(function(a){return !a.blk&&a.st!="Cancelado"}).length;
 var rev=es.filter(function(a){return !a.blk&&a.st!="Cancelado"}).reduce(function(s,a){return s+a.p},0);
 h='<div class="g4"><div class="kpi"><b>'+tot+'</b><span>atendimentos no dia</span></div><div class="kpi"><b>'+brl(rev)+'</b><span>previsto no dia</span></div></div>'+h;

 openM('<h2>'+(id?"Lançamento":"Novo lançamento")+'</h2><div class="seg" style="margin-bottom:10px"><button type="button" id="ftR" class="'+(f.tp=="R"?"on":"")+'" onclick="this.classList.add(\'on\');$(\'ftP\').classList.remove(\'on\')">Receber</button><button type="button" id="ftP" class="'+(f.tp=="P"?"on":"")+'" onclick="this.classList.add(\'on\');$(\'ftR\').classList.remove(\'on\')">Pagar</button></div><div class="g2"><div><label for="fv">Valor (R$) *</label><input id="fv" type="number" min="0" step="0.01" value="'+f.v+'"></div><div><label for="fd">Vencimento *</label><input id="fd" type="date" value="'+f.dt+'"></div><div><label for="fpg">Data do pagamento (se já pago)</label><input id="fpg" type="date" value="'+f.pg+'"></div><div><label for="ffp">Forma de pagamento</label><select id="ffp">'+FP.map(function(p){return '<option'+(p==f.fp?" selected":"")+'>'+p+'</option>'}).join("")+'</select></div></div><label for="fde">Descrição</label><input id="fde" value="'+esc(f.desc)+'" placeholder="Esmaltes, aluguel, sinal…">'+(id?"":'<label for="fn">Parcelar em (nº de vezes)</label><input id="fn" type="number" min="1" max="24" value="1">')+'<div class="bar"><button class="btn p" type="button" onclick="saveFin(\''+(id||"")+'\')">Lançar</button><button class="btn" type="button" onclick="closeM()">Cancelar</button>'+(id&&!f.pg?'<button class="btn" type="button" onclick="baixa(\''+id+'\')">Dar baixa hoje</button>':"")+(id?'<button class="btn d" type="button" onclick="delFin(\''+id+'\')">Excluir</button>':"")+'</div>')}
function saveFin(id){var o={tp:$("ftR").classList.contains("on")?"R":"P",v:+$("fv").value,dt:$("fd").value,pg:$("fpg").value,fp:$("ffp").value,desc:$("fde").value.trim()};if(!(o.v>0)||!o.dt){toast("Informe valor e vencimento");return}
 if(id)Object.assign(S.f.find(function(x){return x.id==id}),o);else{var n=Math.max(1,+$("fn").value||1);for(var i=0;i<n;i++){var d=pd(o.dt);d.setMonth(d.getMonth()+i);S.f.push({id:uid(),tp:o.tp,v:Math.round(o.v/n*100)/100,desc:o.desc,dt:iso(d),pg:n>1?"":o.pg,fp:o.fp,par:n>1?(i+1)+"/"+n:""})}}
 save();closeM();render()}
function baixa(id){var f=S.f.find(function(x){return x.id==id});f.pg=iso(new Date());save();closeM();render()}
function delFin(id){var f=S.f.find(function(x){return x.id==id});if(f&&f.ap){var a=ap(f.ap);if(a){a.st="Finalizado";delete a.fid}}S.f=S.f.filter(function(x){return x.id!=id});save();closeM();render()}
/* ---- início ---- */
var T=[["agenda","Agenda"],["clientes","Clientes"],["servicos","Serviços"],["fin","Financeiro"]];
function render(){$("tabs").innerHTML=T.map(function(t){return '<button type="button" class="'+(tab==t[0]?"on":"")+'" onclick="if(tab!=\''+t[0]+'\'){q=\'\';sf=[]}tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("");
 var y=window.scrollY;$("v").innerHTML=tab=="agenda"?agendaV():tab=="clientes"?clientsV():tab=="servicos"?servicesV():finV();window.scrollTo(0,y)}
load();render();if(CFG.url){if(dirty)push();else pull()}else setSync("só neste aparelho");
</script>
