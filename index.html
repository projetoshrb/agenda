 var l=S.f.filter(function(f){return (ft=="all"||f.tp==ft)&&inr(f.dt)}).sort(function(a,b){return a.dt<b.dt?1:-1});
 if(!l.length)return h+'<div class="empty">Nenhum lançamento neste período.<br>Atendimentos faturados entram aqui automaticamente.</div>';
 return h+l.map(function(f){var s=fst(f);return '<div class="card" style="cursor:pointer" onclick="finM(\''+f.id+'\')"><div class="row"><b>'+esc(f.desc||(f.tp=="R"?"Recebimento":"Pagamento"))+(f.par?' <span class="mu">'+f.par+'</span>':"")+'</b><b class="'+(f.tp=="R"?"pos":"neg")+'">'+(f.tp=="R"?"+":"−")+brl(f.v)+'</b></div><div class="mu">'+s+' · venc. '+br(f.dt)+(f.pg?" · pago "+br(f.pg)+" ("+esc(f.fp||"")+")":"")+'</div></div>'}).join("")}
function finM(id){var f=id?S.f.find(function(x){return x.id==id}):{tp:"R",v:"",desc:"",dt:iso(new Date()),pg:"",fp:"PIX"};
 openM('<h2>'+(id?"Lançamento":"Novo lançamento")+'</h2><div class="seg" style="margin-bottom:10px"><button type="button" id="ftR" class="'+(f.tp=="R"?"on":"")+'" onclick="this.classList.add(\'on\');$(\'ftP\').classList.remove(\'on\')">Receber</button><button type="button" id="ftP" class="'+(f.tp=="P"?"on":"")+'" onclick="this.classList.add(\'on\');$(\'ftR\').classList.remove(\'on\')">Pagar</button></div><div class="g2"><div><label for="fv">Valor (R$) *</label><input id="fv" type="number" min="0" step="0.01" value="'+f.v+'"></div><div><label for="fd">Vencimento *</label><input id="fd" type="date" value="'+f.dt+'"></div><div><label for="fpg">Data do pagamento (se já pago)</label><input id="fpg" type="date" value="'+f.pg+'"></div><div><label for="ffp">Forma de pagamento</label><select id="ffp">'+FP.map(function(p){return '<option'+(p==f.fp?" selected":"")+'>'+p+'</option>'}).join("")+'</select></div></div><label for="fde">Descrição</label><input id="fde" value="'+esc(f.desc)+'" placeholder="Esmaltes, aluguel, sinal…">'+(id?"":'<label for="fn">Parcelar em (nº de vezes)</label><input id="fn" type="number" min="1" max="24" value="1">')+'<div class="bar"><button class="btn p" type="button" onclick="saveFin(\''+(id||"")+'\')">Lançar</button><button class="btn" type="button" onclick="closeM()">Cancelar</button>'+(id&&!f.pg?'<button class="btn" type="button" onclick="baixa(\''+id+'\')">Dar baixa hoje</button>':"")+(id?'<button class="btn d" type="button" onclick="delFin(\''+id+'\')">Excluir</button>':"")+'</div>')}
function saveFin(id){var o={tp:$("ftR").classList.contains("on")?"R":"P",v:+$("fv").value,dt:$("fd").value,pg:$("fpg").value,fp:$("ffp").value,desc:$("fde").value.trim()};if(!(o.v>0)||!o.dt){toast("Informe valor e vencimento");return}
 if(id)Object.assign(S.f.find(function(x){return x.id==id}),o);else{var n=Math.max(1,+$("fn").value||1);for(var i=0;i<n;i++){var d=pd(o.dt);d.setMonth(d.getMonth()+i);S.f.push({id:uid(),tp:o.tp,v:Math.round(o.v/n*100)/100,desc:o.desc,dt:iso(d),pg:n>1?"":o.pg,fp:o.fp,par:n>1?(i+1)+"/"+n:""})}}

function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"")}
function parseTab(t){t=t.replace(/^﻿/,"");var f=t.split(/\r?\n/)[0]||"",d=f.indexOf("\t")>=0?"\t":(f.split(";").length>=f.split(",").length?";":","),rows=[],row=[],cur="",q=false;
 for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c=='"')q=true;
  else if(c==d){row.push(cur);cur=""}
  else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}
  else cur+=c}
 if(cur!==""||row.length){row.push(cur);rows.push(row)}
 return rows.filter(function(r){return r.some(function(x){return x.trim()!==""})})}
var HC={n:["nome","cliente","nomecompleto"],ap:["apelido"],w:["telefone","celular","whatsapp","fone","contato","tel"],em:["email"],nasc:["nascimento","aniversario","datadenascimento","datanascimento","nasc"],ob:["observacoes","observacao","obs","anotacoes"]};
var HS={n:["servico","nome","nomedoservico"],e:["especialidade","categoria","grupo","tipo"],d:["duracao","tempo","minutos","duracaomin"],p:["preco","valor","precovenda"],pm:["precomaximo","precomax","valormaximo"],ds:["descricao","detalhes"]};
function mapCols(h,H){var m={};h.forEach(function(x,i){var k=norm(x);for(var f in H)if(H[f].indexOf(k)>=0&&m[f]===undefined)m[f]=i});return m}
function nd(s){s=String(s||"").trim();var m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){var y=+m[3];if(y<100)y+=y>30?1900:2000;return y+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2)}m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
function nnum(s){s=String(s||"").replace(/[^\d,.\-]/g,"");if(!s)return 0;if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");return parseFloat(s)||0}
function ndur(s){s=String(s||"").trim().toLowerCase();var m=s.match(/^(\d+)\s*h\s*(\d+)?/);if(m)return +m[1]*60+(+m[2]||0);m=s.match(/^(\d+):(\d+)/);if(m)return +m[1]*60+ +m[2];return parseInt(s,10)||60}
function impM(k){var c=k=="c";openM('<h2>Importar '+(c?"clientes":"serviços")+'</h2><p class="mu">Copie as linhas da sua planilha (com a linha de títulos) e cole abaixo, ou escolha um arquivo .csv. Colunas aceitas: '+(c?"Nome, Telefone, Apelido, E-mail, Nascimento, Observações. Sem títulos, use a ordem Nome, Telefone, Apelido, Nascimento, Observações.":"Serviço, Especialidade, Duração (minutos), Preço, Preço máximo, Descrição. Sem títulos, use a ordem Serviço, Especialidade, Duração, Preço.")+' Quem já existe é ignorado.</p><label for="imt">Lista colada</label><textarea id="imt" rows="7"></textarea><label for="imf">ou arquivo .csv / .txt</label><input type="file" id="imf" accept=".csv,.txt,.tsv,text/csv,text/plain"><div class="bar"><button class="btn p" type="button" onclick="doImp(\''+k+'\')">Importar</button><button class="btn" type="button" onclick="closeM()">Cancelar</button></div>');
 $("imf").onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){$("imt").value=rd.result};rd.readAsText(f)}}
function doImp(k){var rows=parseTab($("imt").value);if(!rows.length){toast("Cole a lista primeiro");return}
 var H=k=="c"?HC:HS,m=mapCols(rows[0],H);if(m.n!==undefined)rows=rows.slice(1);else m=k=="c"?{n:0,w:1,ap:2,nasc:3,ob:4}:{n:0,e:1,d:2,p:3};
 var add=0,skip=0;rows.forEach(function(r){var g=function(f){return m[f]===undefined?"":String(r[m[f]]||"").trim()},nome=g("n");if(!nome){skip++;return}
  if(k=="c"){var w=g("w"),dg=w.replace(/\D/g,""),dup=S.c.some(function(c){return dg?c.w.replace(/\D/g,"")==dg:c.n.toLowerCase()==nome.toLowerCase()});if(dup){skip++;return}
   S.c.push({id:uid(),n:nome,ap:g("ap"),w:w,em:g("em"),nasc:nd(g("nasc")),ob:g("ob"),nt:true});add++}
  else{if(S.s.some(function(s){return s.n.toLowerCase()==nome.toLowerCase()})){skip++;return}
   S.s.push({id:uid(),n:nome,e:g("e")||"Geral",d:ndur(g("d")),p:nnum(g("p")),pm:nnum(g("pm")),ds:g("ds")});add++}});
 if(add)save();closeM();render();toast(add+" importado(s)"+(skip?" · "+skip+" ignorado(s): sem nome ou já existiam":""))}
